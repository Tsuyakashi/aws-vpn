name: Deploy Infra

on:
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init / Apply
        working-directory: ./xray-core
        run: |
          terraform init
          terraform apply --auto-approve

      - name: Wait and fetch Xray client link from SSM
        run: |
          for i in $(seq 1 20); do
            if aws ssm get-parameter --name "/vpn/client-config" --with-decryption &>/dev/null; then
              echo "Config ready"
              aws ssm get-parameter \
                --name "/vpn/client-config" \
                --with-decryption \
                --query Parameter.Value \
                --output text > xray-client.txt
              exit 0
            fi
            echo "$i. Not ready yet..."
            sleep 15
          done
          echo "Timed out" && exit 1

      - name: Generate QR code
        run: |
          sudo apt-get update -y && sudo apt-get install -y qrencode
          qrencode -o xray-client.png < xray-client.txt

      - name: Upload Xray client config
        uses: actions/upload-artifact@v4
        with:
          name: xray-config
          path: |
            xray-client.txt
            xray-client.png

      - name: Upload Terraform state
        uses: actions/upload-artifact@v4
        with:
          name: tfstate
          path: xray-core/terraform.tfstate
